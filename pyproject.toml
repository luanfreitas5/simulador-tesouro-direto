# =============================================================================
# pyproject.toml — fonte única de verdade para dependências e configuração de
# ferramentas. Alinhado ao CLAUDE.md (Data Science Projects).
# Gerenciador: uv. O uv.lock DEVE ser commitado (gere com `uv lock`).
# =============================================================================

[project]
name = "simulador-tesouro-direto"
version = "0.1.0"
description = "Curva de juros histórica e simulador de rentabilidade real do Tesouro Direto (Polars + Streamlit)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luan Freitas", email = "luan.mgf@gmail.com" }]
keywords = ["tesouro-direto", "curva-de-juros", "renda-fixa", "polars", "streamlit", "ipca", "selic"]
classifiers = [ # https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: Portuguese (Brazilian)",
]

# --- Dependências de runtime (cada uma com justificativa) --------------------
dependencies = [
    # Configuração e validação (src/config/)
    "pydantic>=2.13.5",                         # validação tipada das configurações
    "pydantic-settings>=2.15.0",                # configuração com override por variáveis de ambiente
    "pyyaml>=6.0.3",                            # leitura dos arquivos em configs/
    # Dados: manipulação, contratos e I/O
    "polars>=1.44.1",                           # manipulação de dados (no lugar de pandas)
    "pandera[polars]>=0.33.1",                  # contratos de dados entre as camadas bronze/silver/gold
    "pyarrow>=25.0.1",                          # suporte a Parquet/interoperabilidade
    "numpy>=2.2.6",                             # contagem de dias úteis (busday_count)
    "requests>=2.32.0",                         # download do Tesouro Transparente e da API SGS do BCB
    "pandas>=2.3.3",                            # manipulação de datas e séries temporais (no lugar de datetime)
    # Visualização e terminal
    "plotly>=6.0.0",                            # curva de juros navegável por data
    "rich>=15.0.0",                             # logging e barras de progresso
]

[project.optional-dependencies]
# Aplicativo web (make install-app / uv sync --extra app)
app = [
    "streamlit>=1.50.0",                      # simulador interativo
]

[tool.uv]
# O projeto não é instalado como pacote: `src/` é a raiz de importação (ver
# CLAUDE.md, "Import style"). O pytest resolve os imports por
# `pythonpath = ["src"]` e `src/main.py` é executado diretamente.
package = false
default-groups = ["dev", "quality", "docs"]  # `uv sync --dev` do CI continua cobrindo todas as ferramentas
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# --- Dependências de desenvolvimento (não publicadas; PEP 735) --------------
[dependency-groups]
# Dia a dia: lint, testes e hooks (rápidos)
dev = [
    "ruff>=0.5",                    # linter e formatador (substitui flake8/isort/black)
    "basedpyright>=1.13",           # type checker estático (substitui mypy; roda no CI)
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.165.0",          # testes baseados em propriedades
    "pre-commit>=3.7",
    "commitizen>=4.16.5",           # Conventional Commits + CHANGELOG
    "detect-secrets>=1.5",          # detecção de segredos
    "nbstripout>=0.7",              # remove saídas de notebooks antes do commit
    "nbqa>=1.8",                    # ferramentas de qualidade em notebooks
]
# Checagens pesadas (CI e `make check`)
quality = [
    "bandit[toml]>=1.7",            # análise de segurança do código
    "pip-audit>=2.7",               # auditoria de vulnerabilidades das dependências
    "vulture>=2.11",                # código morto
    "refurb>=2.0",                  # sugestões de modernização
    "xenon>=0.9",                   # limites de complexidade
    "radon>=6.0",                   # métricas de complexidade
    "interrogate>=1.7",             # cobertura de docstrings
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
# Uso sob demanda: profiling e Jupyter no VSCode
extras = [
    "scalene>=1.5",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.3",
]

[project.urls]
Homepage = "https://github.com/luanfreitas5/simulador-tesouro-direto"
Documentation = "https://luanfreitas5.github.io/simulador-tesouro-direto/"
Repository = "https://github.com/luanfreitas5/simulador-tesouro-direto"


# =============================================================================
# RUFF — lint + format (substitui flake8/isort/black)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (organização de imports)
    "N",      # pep8-naming
    "UP",     # pyupgrade (sintaxe moderna)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "NPY",    # NumPy-specific rules
    "PERF",   # perflint
    "RUF",    # regras específicas do Ruff
    "PL",     # pylint (subconjunto)
    "TRY",    # tryceratops
    "S",      # flake8-bandit (segurança)
    "D",      # pydocstyle (docstrings, convenção numpy)
]
ignore = [
    "PLR0913", # muitos argumentos — comum em funções financeiras
    "PLR2004", # "magic value" em comparação
    "TRY003",  # mensagem longa em exceção customizada
    "PLR0917", # muitos parâmetros posicionais
    "PLC0415", # import fora do topo — usado em testes para isolar imports
    "RUF001",  # caractere ambíguo em string — tipografia pt-BR intencional
    "RUF002",  # idem, em docstrings
    "PERF203", # try/except em loop — usado para isolar falhas por item
    "D203",    # conflita com D211
    "D213",    # conflita com D212
    "D401",    # exige modo imperativo em inglês; docstrings em pt-BR usam a 3ª pessoa
]

[tool.ruff.lint.isort]
# `src/` é a raiz de importação: os pacotes de primeira parte são os
# diretórios dentro dele — não "src" em si.
known-first-party = [
    "config",
    "constants",
    "data",
    "exceptions",
    "features",
    "finance",
    "pipelines",
    "preprocessing",
    "schemas",
    "utils",
    "visualization",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "D", "E501", "PLR2004", "S101"]  # fixtures, valores fixos e asserts em testes
"notebooks/*" = ["B018", "D", "E402", "F401", "F821", "S101"]  # B018: expressão final exibe o objeto na célula
"app/*" = ["D", "E402"]                      # sys.path precisa ser ajustado antes dos imports
"src/main.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

# =============================================================================
# BASEDPYRIGHT — type checking estático (roda no CI)
# =============================================================================
[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src", "tests"]
# `src/` é a raiz de importação: sem isto, `from config.settings import ...`
# não resolveria para o type checker.
extraPaths = ["src"]
exclude = ["**/__pycache__", "notebooks", "data", "reports", "logs"]
reportMissingTypeStubs = false

# =============================================================================
# BANDIT — análise de segurança (roda no CI)
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv"]

# =============================================================================
# VULTURE — detecção de código morto
# =============================================================================
[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = ["notebooks/"]
ignore_decorators = ["@field_validator", "@model_validator"]
ignore_names = ["cls", "settings_cls", "dotenv_settings", "file_secret_settings"]

# =============================================================================
# REFURB — sugestões de modernização
# =============================================================================
[tool.refurb]
ignore = [
    "FURB105",  # print() sem parênteses vazios
    "FURB126",  # return implícito
]

# =============================================================================
# PYTEST — testes (unit, integração, property-based)
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "smoke: testes rápidos rodados no pre-commit",
    "integration: testes de pipeline ponta a ponta",
    "slow: testes lentos (pulados por padrão localmente)",
]

# =============================================================================
# COVERAGE — meta de cobertura ≥ 80%
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/main.py",           # orquestração fina (argparse), coberta pelos testes de pipeline
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# =============================================================================
# INTERROGATE — cobertura de docstrings
# =============================================================================
[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-magic = true
exclude = ["tests", "notebooks", "docs"]

# =============================================================================
# COMMITIZEN — Conventional Commits + SemVer + CHANGELOG
# =============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
    "src/__init__.py:__version__",
    "configs/config.yaml:version"
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true  # remove quando sair do 0.x
